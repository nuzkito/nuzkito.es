name: Deploy web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://nuzkito.es
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd
          tools: composer:v2

      - name: Install Pluma
        run: |
          set -a; . ./.env; set +a
          composer global require "nuzkito/pluma:${PLUMA_VERSION}" --prefer-dist --no-interaction --optimize-autoloader
          composer global config bin-dir --absolute >> "$GITHUB_PATH"

      - name: Set production URL
        run: |
          jq '.url = "https://nuzkito.es"' pluma-settings.json > pluma-settings.tmp.json
          mv pluma-settings.tmp.json pluma-settings.json

      - name: Build with Pluma
        run: pluma generate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
